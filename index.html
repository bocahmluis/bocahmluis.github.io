<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bocahmliu</title>
<style>
    :root{--bg:#07070a;--muted:#999}
    html,body{height:100%;margin:0}
    body{
        margin: 0;
        background: linear-gradient(135deg,#02020a,#0a0a0f 40%,#071226 100%);
        overflow: hidden;
        font-family: 'Poppins', sans-serif;
        color: white;
    }
    /* centered animated text */
    #text-anim {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%,-50%);
        width: 90%;
        text-align: center;
        font-size: clamp(20px, 4vw, 48px);
        font-weight: 800;
        letter-spacing: 0.02em;
        z-index: 30;
        pointer-events: none;
        mix-blend-mode: screen;
        text-shadow: 0 8px 24px rgba(0,0,0,0.6), 0 0 40px rgba(0,255,200,0.06);
        animation: breathe 3.5s ease-in-out infinite;
    }
    @keyframes breathe{
        0%{transform: translate(-50%,-50%) scale(0.98); opacity:.6}
        50%{transform: translate(-50%,-50%) scale(1.02); opacity:1}
        100%{transform: translate(-50%,-50%) scale(0.98); opacity:.6}
    }

    /* background canvases fill */
    .chart-layer{
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }
    /* place two canvases stacked */
    #chart1 { z-index: 5; }
    #chart2 { z-index: 3; filter: blur(2px) opacity(.9); }

    /* subtle vignette */
    .vignette{
        position:absolute; inset:0; pointer-events:none; z-index:40;
        background: radial-gradient(ellipse at center, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.6) 60%);
    }

    /* tiny overlay grid for cyber feel */
    .grid {
        position:absolute; inset:0; z-index:2; pointer-events:none; opacity:.05;
        background-image: linear-gradient(0deg, rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 60px 60px;
    }

    /* responsive safe area to keep text visible */
    @media (max-width: 600px) {
    /* perkecil legend chart */
    .chartjs-legend li span {
        font-size: 10px !important;
    }

    #text-anim {
        font-size: 16px;
        padding: 0 15px;
    }
}

</style>
</head>
<body>

<div id="text-anim">Saya doakan anda jadi orang yang bermanfaat</div>

<canvas id="chart1" class="chart-layer" aria-hidden="true"></canvas>
<canvas id="chart2" class="chart-layer" aria-hidden="true"></canvas>
<div class="grid"></div>
<div class="vignette"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const c1 = document.getElementById('chart1');
const c2 = document.getElementById('chart2');
const ctx1 = c1.getContext('2d');
const ctx2 = c2.getContext('2d');

// gradient creator
function createGradient(ctx, colors){
  const g = ctx.createLinearGradient(0,0,ctx.canvas.width,0);
  const step = 1 / (colors.length - 1);
  colors.forEach((c,i)=> g.addColorStop(i*step, c));
  return g;
}

function randomData(n=20){
  return Array.from({length:n}, ()=>Math.floor(Math.random()*100)+5);
}

const labels = Array.from({length:20}, (_,i)=> i+1);

// CHART 1 - fully responsive
const chart1 = new Chart(ctx1, {
  type: 'line',
  data: {
    labels,
    datasets: [
      { label:'Merkurius', data:randomData(), borderWidth:3, pointRadius:0, tension:0.4 },
      { label:'Bumi', data:randomData(), borderWidth:3, pointRadius:0, tension:0.4 },
      { label:'Pluto', data:randomData(), borderWidth:3, pointRadius:0, tension:0.4 },
      { label:'Saturnus', data:randomData(), borderWidth:3, pointRadius:0, tension:0.4 },
      { label:'Mars', data:randomData(), borderWidth:3, pointRadius:0, tension:0.4 }
    ]
  },
  options:{
    responsive:true,
    maintainAspectRatio:false,
    scales:{x:{display:false}, y:{display:false}},
    plugins:{
      legend:{
        display:true,
        position:'top',
        labels:{ color:"#fff" }
      }
    }
  }
});

// CHART 2 - responsive bar
const chart2 = new Chart(ctx2, {
  type: 'bar',
  data: {
    labels,
    datasets: [{
      label: 'Analisis 2',
      data: randomData(),
      backgroundColor:(ctx)=> createGradient(ctx.chart.ctx, ['rgba(255,80,180,0.9)','rgba(255,160,100,0.7)'])
    }]
  },
  options:{
    responsive:true,
    maintainAspectRatio:false,
    scales:{x:{display:false}, y:{display:false}},
    plugins:{legend:{display:false}}
  }
});

// UPDATE BERKALA
function tickUpdate(){
  const lineGrads = [
    ['#00ffe1','#00a8ff','#8a00ff'],
    ['#ff4b4b','#ff7f50','#ffcc00'],
    ['#ff1493','#c71585','#ff6347'],
    ['#32cd32','#8b4513','#a0522d'],
    ['#4b0082','#9400d3','#8a2be2']
  ];

  chart1.data.datasets.forEach((ds,i)=>{
    ds.data = randomData();
    ds.borderColor = createGradient(ctx1, lineGrads[i]);
  });

  chart2.data.datasets[0].data = randomData();

  chart1.update();
  chart2.update();
}

setInterval(tickUpdate, 2500);
setTimeout(tickUpdate, 600);

</script>

</body>
</html>
